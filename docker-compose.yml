# improv REST service + Postgres.
#
# The reverse proxy lives outside Docker, so the API binds to 127.0.0.1 only.
# All configuration comes from .env — copy .env.example and fill it in.
#
#   docker compose up -d --build
#
# Bring-up order is enforced: db becomes healthy, then migrate and schema-sync
# both run to completion, then api starts. Nothing self-creates schema —
# Alembic owns the OLTP side, `improv schema sync` owns the columnar side.

name: improv

x-improv-image: &improv-image
  image: improv:local
  build:
    context: .
    args:
      # Must match the owner of any bind-mounted IMPROV_STORAGE_PATH.
      UID: "${IMPROV_UID:-1000}"
      GID: "${IMPROV_GID:-1000}"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the shell inside the container expands it.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot. Idempotent: a second `up` re-runs it and it exits 0 with nothing
  # to do, because `improv db upgrade` is a no-op at head.
  migrate:
    <<: *improv-image
    env_file: .env
    command: ["improv", "db", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot, and the only thing that creates columnar tables. Deliberately
  # separate from `migrate`: it talks to the columnar store (VAST DB or
  # DuckDB+Parquet), not Postgres, so it needs no `db` dependency and a failure
  # here points at the columnar backend rather than at migrations.
  #
  # This exists because the API cannot do it. With WEB_CONCURRENCY > 1, uvicorn
  # forks several workers that would each run creation concurrently, and no
  # backend offers an atomic create-if-absent — VastDB's fail_if_exists is a
  # client-side check before an unconditional create RPC. One process, once.
  #
  # Idempotent: a second `up` re-runs it and it exits 0 with nothing to do.
  # Re-run it after adding a plugin to IMPROV_PLUGINS — a `docker compose up`
  # does this for you, but `docker compose restart api` does not. If you skip
  # it, api refuses to start and names the missing tables rather than failing
  # later on the first write.
  #
  # If IMPROV_DB_BACKEND=duckdb with a local-path IMPROV_DB_ROOT, this service
  # needs the same bind mount as `api` — otherwise it writes the Parquet
  # registry into its own throwaway container filesystem and `api` sees no
  # tables. No mount is needed for an s3:// root or for VAST DB, which is why
  # none is set here.
  schema-sync:
    <<: *improv-image
    env_file: .env
    command: ["improv", "schema", "sync"]
    restart: "no"

  api:
    <<: *improv-image
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      schema-sync:
        condition: service_completed_successfully
    # Host-only. The reverse proxy on the host connects here; nothing else can.
    ports:
      - "127.0.0.1:8000:8000"
    # uvicorn's supervisor reaps its own workers, but init gives a real PID 1 to
    # reap anything else, and the grace period lets in-flight requests drain.
    init: true
    stop_grace_period: 30s
    # Healthcheck and command come from the image. Worker count is WEB_CONCURRENCY
    # and the proxy allowlist is FORWARDED_ALLOW_IPS — both set in .env, so
    # neither needs a command override here.

    # Uncomment for the filesystem object store instead of VAST S3. The path must
    # be writable by UID:GID above.
    # volumes:
    #   - /mnt/vast/improv-objects:/data/objects

    # Uncomment if the VAST endpoints use an internally-signed certificate. Set
    # SSL_CERT_FILE and REQUESTS_CA_BUNDLE in .env to the container path.
    # volumes:
    #   - /etc/ssl/certs/example-internal-ca.crt:/etc/ssl/certs/example-internal-ca.crt:ro

volumes:
  pgdata:
