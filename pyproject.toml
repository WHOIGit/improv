[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "improv"
version = "0.1.0"
description = "Image provenance substrate for scientific imaging instruments"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "rfc8785>=0.1",
    "httpx",
    "amplify-db-utils @ git+https://github.com/WHOIGit/amplify-db-utils.git@v0.1.1",
    "amplify-storage-utils @ git+https://github.com/WHOIGit/amplify-storage-utils.git@v1.7.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
]
vastdb = [
    "amplify-db-utils[vastdb] @ git+https://github.com/WHOIGit/amplify-db-utils.git@v0.1.1",
]
service = [
    "fastapi",
    "uvicorn[standard]",
    "alembic",
    "click",
    "improv[db]",
    # [s3] adds boto3/aiobotocore for the S3-backed object store. Same pinned
    # tag as the base dependency above.
    "amplify-storage-utils[s3] @ git+https://github.com/WHOIGit/amplify-storage-utils.git@v1.7.0",
]
dev = [
    "pytest",
    "improv[service]",
]

[project.scripts]
improv = "improv.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

# The Alembic revision template is not a .py file, so package discovery misses
# it. `improv db upgrade` does not need it, but `alembic revision` does — without
# this, autogenerate only works from a source checkout, not an installed wheel.
[tool.setuptools.package-data]
"improv.oltp.migrations" = ["script.py.mako"]
